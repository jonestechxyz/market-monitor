<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Trace Helper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* The image overlay — transformed via JS */
    #overlay-img {
      position: fixed;
      z-index: 2;
      transform-origin: center center;
      pointer-events: none;
      display: none;
    }

    #gesture-layer {
      position: fixed;
      inset: 0;
      z-index: 3;
      touch-action: none;
    }

    #controls {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 18px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 40px;
      padding: 12px 24px;
    }

    .ctrl-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 22px;
      color: #fff;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .ctrl-btn:active { background: rgba(255,255,255,0.35); }

    .slider-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .slider-label {
      color: rgba(255,255,255,0.7);
      font-size: 10px;
      letter-spacing: 0.05em;
      font-family: -apple-system, sans-serif;
      text-transform: uppercase;
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 120px; height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.3);
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    #welcome {
      position: fixed;
      inset: 0;
      z-index: 15;
      background: rgba(0,0,0,0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      color: #fff;
      font-family: -apple-system, sans-serif;
      padding: 32px;
      text-align: center;
    }
    #welcome h1 { font-size: 28px; font-weight: 700; }
    #welcome p  { font-size: 15px; color: rgba(255,255,255,0.75); max-width: 300px; line-height: 1.5; }
    #start-btn {
      background: #fff; color: #000;
      border: none; border-radius: 30px;
      padding: 14px 36px;
      font-size: 17px; font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #file-input { display: none; }
  </style>
</head>
<body>

<video id="camera" autoplay playsinline muted></video>
<img id="overlay-img" />
<div id="gesture-layer"></div>

<div id="controls">
  <label for="file-input" class="ctrl-btn" title="Load image">🖼️</label>
  <input type="file" id="file-input" accept="image/*" />

  <div class="slider-group">
    <span class="slider-label">Opacity</span>
    <input type="range" id="opacity-slider" min="5" max="100" value="50" />
  </div>

  <div class="ctrl-btn" id="reset-btn" title="Reset">⟳</div>
</div>

<div id="welcome">
  <h1>✏️ Trace Helper</h1>
  <p>Load a picture, place the tablet over your paper, and trace what you see.</p>
  <button id="start-btn">Get Started</button>
</div>

<script>
const video        = document.getElementById('camera');
const overlayImg   = document.getElementById('overlay-img');
const gestureLayer = document.getElementById('gesture-layer');
const opacitySlider= document.getElementById('opacity-slider');
const fileInput    = document.getElementById('file-input');
const resetBtn     = document.getElementById('reset-btn');
const welcome      = document.getElementById('welcome');
const startBtn     = document.getElementById('start-btn');

// transform state
let tr = { x: 0, y: 0, scale: 1, rotation: 0 };
let imgW = 0, imgH = 0;

function applyTransform() {
  overlayImg.style.transform =
    `translate(calc(-50% + ${tr.x}px), calc(-50% + ${tr.y}px)) ` +
    `rotate(${tr.rotation}rad) scale(${tr.scale})`;
}

function resetTransform() {
  const scaleX = window.innerWidth  / imgW;
  const scaleY = window.innerHeight / imgH;
  tr = { x: 0, y: 0, scale: Math.min(scaleX, scaleY) * 0.9, rotation: 0 };
  overlayImg.style.left = '50%';
  overlayImg.style.top  = '50%';
  applyTransform();
}

// ── camera ──────────────────────────────────────────────────────────────────
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
    video.srcObject = stream;
  } catch (e) {
    console.warn('Camera error', e);
  }
}

// ── image load ───────────────────────────────────────────────────────────────
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  overlayImg.onload = () => {
    imgW = overlayImg.naturalWidth;
    imgH = overlayImg.naturalHeight;
    overlayImg.style.width  = imgW + 'px';
    overlayImg.style.height = imgH + 'px';
    overlayImg.style.display = 'block';
    resetTransform();
    URL.revokeObjectURL(url);
  };
  overlayImg.src = url;
});

// ── opacity ──────────────────────────────────────────────────────────────────
opacitySlider.addEventListener('input', () => {
  overlayImg.style.opacity = opacitySlider.value / 100;
});
overlayImg.style.opacity = 0.5;

// ── reset ────────────────────────────────────────────────────────────────────
resetBtn.addEventListener('click', resetTransform);

// ── touch gestures ────────────────────────────────────────────────────────────
let gestureStart = null;
let singleStart  = null;

function getTouches(e) { return Array.from(e.touches); }
function tDist(a, b)   { return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
function tAngle(a, b)  { return Math.atan2(b.clientY - a.clientY, b.clientX - a.clientX); }
function tMid(a, b)    { return { x: (a.clientX+b.clientX)/2, y: (a.clientY+b.clientY)/2 }; }

gestureLayer.addEventListener('touchstart', e => {
  e.preventDefault();
  const ts = getTouches(e);
  if (ts.length === 1) {
    singleStart = { cx: ts[0].clientX, cy: ts[0].clientY, tx: tr.x, ty: tr.y };
    gestureStart = null;
  } else if (ts.length >= 2) {
    gestureStart = {
      dist: tDist(ts[0], ts[1]),
      angle: tAngle(ts[0], ts[1]),
      mid: tMid(ts[0], ts[1]),
      scale: tr.scale, rotation: tr.rotation,
      tx: tr.x, ty: tr.y,
    };
    singleStart = null;
  }
}, { passive: false });

gestureLayer.addEventListener('touchmove', e => {
  e.preventDefault();
  const ts = getTouches(e);
  if (ts.length === 1 && singleStart) {
    tr.x = singleStart.tx + ts[0].clientX - singleStart.cx;
    tr.y = singleStart.ty + ts[0].clientY - singleStart.cy;
    applyTransform();
  } else if (ts.length >= 2 && gestureStart) {
    const d   = tDist(ts[0], ts[1]);
    const a   = tAngle(ts[0], ts[1]);
    const mid = tMid(ts[0], ts[1]);
    tr.scale    = gestureStart.scale    * (d / gestureStart.dist);
    tr.rotation = gestureStart.rotation + (a - gestureStart.angle);
    tr.x        = gestureStart.tx + mid.x - gestureStart.mid.x;
    tr.y        = gestureStart.ty + mid.y - gestureStart.mid.y;
    applyTransform();
  }
}, { passive: false });

gestureLayer.addEventListener('touchend', e => {
  e.preventDefault();
  if (e.touches.length === 0) { singleStart = null; gestureStart = null; }
}, { passive: false });

// ── welcome ───────────────────────────────────────────────────────────────────
startBtn.addEventListener('click', async () => {
  welcome.style.display = 'none';
  await startCamera();
});
</script>
</body>
</html>
