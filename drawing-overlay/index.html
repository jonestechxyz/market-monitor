<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Trace Helper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #overlay-canvas {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none; /* touches handled by gesture-layer */
    }

    /* invisible full-screen layer that receives touch events for the image */
    #gesture-layer {
      position: fixed;
      inset: 0;
      z-index: 3;
      touch-action: none;
    }

    /* controls panel */
    #controls {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 40px;
      padding: 12px 22px;
      white-space: nowrap;
    }

    .ctrl-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 22px;
      color: #fff;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .ctrl-btn:active { background: rgba(255,255,255,0.35); }

    .slider-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .slider-label {
      color: rgba(255,255,255,0.7);
      font-size: 10px;
      letter-spacing: 0.05em;
      font-family: -apple-system, sans-serif;
      text-transform: uppercase;
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 90px; height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.3);
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    /* color swatches */
    .color-row {
      display: flex; gap: 7px; align-items: center;
    }
    .swatch {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.5);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .swatch.active { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.5); }

    /* loading overlay */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: -apple-system, sans-serif;
      font-size: 18px;
    }
    #loading.show { display: flex; }

    /* welcome screen */
    #welcome {
      position: fixed;
      inset: 0;
      z-index: 15;
      background: rgba(0,0,0,0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      color: #fff;
      font-family: -apple-system, sans-serif;
      padding: 32px;
      text-align: center;
    }
    #welcome h1 { font-size: 28px; font-weight: 700; }
    #welcome p { font-size: 15px; color: rgba(255,255,255,0.75); max-width: 300px; line-height: 1.5; }
    #start-btn {
      background: #fff;
      color: #000;
      border: none;
      border-radius: 30px;
      padding: 14px 36px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* hidden file input */
    #file-input { display: none; }
  </style>
</head>
<body>

<video id="camera" autoplay playsinline muted></video>
<canvas id="overlay-canvas"></canvas>
<div id="gesture-layer"></div>

<div id="controls">
  <!-- load image -->
  <label for="file-input" class="ctrl-btn" title="Load image">🖼️</label>
  <input type="file" id="file-input" accept="image/*" />

  <!-- opacity -->
  <div class="slider-group">
    <span class="slider-label">Opacity</span>
    <input type="range" id="opacity-slider" min="5" max="100" value="90" />
  </div>

  <!-- edge threshold -->
  <div class="slider-group">
    <span class="slider-label">Detail</span>
    <input type="range" id="threshold-slider" min="10" max="200" value="60" />
  </div>

  <!-- line color -->
  <div class="color-row">
    <div class="swatch active" data-color="0,0,0" style="background:#000" title="Black"></div>
    <div class="swatch" data-color="220,38,38" style="background:#dc2626" title="Red"></div>
    <div class="swatch" data-color="37,99,235" style="background:#2563eb" title="Blue"></div>
    <div class="swatch" data-color="255,255,255" style="background:#fff" title="White"></div>
  </div>

  <!-- reset position -->
  <div class="ctrl-btn" id="reset-btn" title="Reset position">⟳</div>
</div>

<div id="loading">Processing image…</div>

<div id="welcome">
  <h1>✏️ Trace Helper</h1>
  <p>Load a picture and trace it on paper while looking at the screen.</p>
  <button id="start-btn">Get Started</button>
</div>

<script>
// ── state ──────────────────────────────────────────────────────────────────
const state = {
  transform: { x: 0, y: 0, scale: 1, rotation: 0 },
  opacity: 0.90,
  lineColor: [0, 0, 0],
  edgeData: null,
  threshold: 30,
  canvasW: 0,
  canvasH: 0,
};

// ── DOM refs ───────────────────────────────────────────────────────────────
const video         = document.getElementById('camera');
const overlayCanvas = document.getElementById('overlay-canvas');
const gestureLayer  = document.getElementById('gesture-layer');
const opacitySlider = document.getElementById('opacity-slider');
const threshSlider  = document.getElementById('threshold-slider');
const fileInput     = document.getElementById('file-input');
const resetBtn      = document.getElementById('reset-btn');
const loading       = document.getElementById('loading');
const welcome       = document.getElementById('welcome');
const startBtn      = document.getElementById('start-btn');
const swatches      = document.querySelectorAll('.swatch');
const ctx           = overlayCanvas.getContext('2d');

// ── camera ─────────────────────────────────────────────────────────────────
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
    video.srcObject = stream;
  } catch (e) {
    console.warn('Camera unavailable', e);
  }
}

// ── canvas resize ──────────────────────────────────────────────────────────
function resizeCanvas() {
  overlayCanvas.width  = window.innerWidth;
  overlayCanvas.height = window.innerHeight;
  state.canvasW = overlayCanvas.width;
  state.canvasH = overlayCanvas.height;
  render();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ── Sobel edge detection ───────────────────────────────────────────────────
function detectEdges(imgEl, threshold) {
  const w = imgEl.naturalWidth;
  const h = imgEl.naturalHeight;

  const src = document.createElement('canvas');
  src.width = w; src.height = h;
  const sc = src.getContext('2d');
  sc.drawImage(imgEl, 0, 0);
  const pixels = sc.getImageData(0, 0, w, h);
  const d = pixels.data;

  // greyscale
  const grey = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    grey[i] = 0.299*d[i*4] + 0.587*d[i*4+1] + 0.114*d[i*4+2];
  }

  // Sobel — store gradient magnitude in alpha; RGB stays 0 (colored at render time)
  const mag = new Float32Array(w * h);
  for (let y = 1; y < h-1; y++) {
    for (let x = 1; x < w-1; x++) {
      const idx = y*w + x;
      const gx =
        -grey[idx-w-1] + grey[idx-w+1]
        -2*grey[idx-1] + 2*grey[idx+1]
        -grey[idx+w-1] + grey[idx+w+1];
      const gy =
        -grey[idx-w-1] - 2*grey[idx-w] - grey[idx-w+1]
        +grey[idx+w-1] + 2*grey[idx+w] + grey[idx+w+1];
      mag[idx] = Math.sqrt(gx*gx + gy*gy);
    }
  }

  // Dilation: each pixel takes the max magnitude in a 3×3 neighbourhood to thicken lines
  const out = new Uint8ClampedArray(w * h * 4);
  for (let y = 1; y < h-1; y++) {
    for (let x = 1; x < w-1; x++) {
      const idx = y*w + x;
      let best = 0;
      for (let dy = -1; dy <= 1; dy++)
        for (let dx = -1; dx <= 1; dx++)
          if (mag[(y+dy)*w + (x+dx)] > best) best = mag[(y+dy)*w + (x+dx)];
      // Scale: anything above threshold maps to 255, fading edges between threshold/2 and threshold
      const alpha = best < threshold * 0.5 ? 0
                  : best >= threshold      ? 255
                  : Math.round(((best - threshold * 0.5) / (threshold * 0.5)) * 255);
      out[idx * 4 + 3] = 255 - alpha;
    }
  }

  const result = new ImageData(out, w, h);
  return { imageData: result, w, h };
}

// ── render loop ────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, state.canvasW, state.canvasH);
  if (!state.edgeData) return;

  const { imageData, w, h } = state.edgeData;
  const { x, y, scale, rotation } = state.transform;

  // Color the edge mask: RGB = line color, alpha = edge strength × opacity
  const [r, g, b] = state.lineColor;
  const raw = imageData.data;
  const colored = new Uint8ClampedArray(w * h * 4);
  for (let i = 0; i < colored.length; i += 4) {
    const edgeAlpha = raw[i + 3]; // only the alpha channel holds edge data
    if (edgeAlpha > 0) {
      colored[i]     = r;
      colored[i + 1] = g;
      colored[i + 2] = b;
      colored[i + 3] = Math.round(edgeAlpha * state.opacity);
    }
    // else stays 0,0,0,0 — fully transparent, camera shows through
  }

  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  off.getContext('2d').putImageData(new ImageData(colored, w, h), 0, 0);

  // apply transform
  ctx.save();
  ctx.translate(state.canvasW/2 + x, state.canvasH/2 + y);
  ctx.rotate(rotation);
  ctx.scale(scale, scale);
  ctx.drawImage(off, -w/2, -h/2);
  ctx.restore();
}

// ── image load ─────────────────────────────────────────────────────────────
function loadImage(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  loading.classList.add('show');
  img.onload = () => {
    setTimeout(() => {  // yield to let UI paint
      state.edgeData = detectEdges(img, state.threshold);
      // fit to screen initially
      const scaleX = state.canvasW / state.edgeData.w;
      const scaleY = state.canvasH / state.edgeData.h;
      state.transform = { x: 0, y: 0, scale: Math.min(scaleX, scaleY) * 0.9, rotation: 0 };
      render();
      URL.revokeObjectURL(url);
      loading.classList.remove('show');
    }, 50);
  };
  img.src = url;
}

fileInput.addEventListener('change', e => {
  if (e.target.files[0]) loadImage(e.target.files[0]);
});

// ── touch gestures ─────────────────────────────────────────────────────────
let touch1 = null, touch2 = null;
let gestureStart = null; // { dist, angle, tx, ty, scale, rotation }

function getTouches(e) {
  return Array.from(e.touches);
}

function midpoint(t1, t2) {
  return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
}
function dist(t1, t2) {
  return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
}
function angle(t1, t2) {
  return Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX);
}

gestureLayer.addEventListener('touchstart', e => {
  e.preventDefault();
  const ts = getTouches(e);
  if (ts.length === 1) {
    touch1 = { x: ts[0].clientX, y: ts[0].clientY };
    gestureStart = { tx: state.transform.x, ty: state.transform.y };
  } else if (ts.length === 2) {
    gestureStart = {
      dist: dist(ts[0], ts[1]),
      angle: angle(ts[0], ts[1]),
      mid: midpoint(ts[0], ts[1]),
      scale: state.transform.scale,
      rotation: state.transform.rotation,
      tx: state.transform.x,
      ty: state.transform.y,
    };
  }
}, { passive: false });

gestureLayer.addEventListener('touchmove', e => {
  e.preventDefault();
  const ts = getTouches(e);

  if (ts.length === 1 && gestureStart && touch1) {
    const dx = ts[0].clientX - touch1.x;
    const dy = ts[0].clientY - touch1.y;
    state.transform.x = gestureStart.tx + dx;
    state.transform.y = gestureStart.ty + dy;
    render();
  } else if (ts.length === 2 && gestureStart && gestureStart.dist) {
    const d = dist(ts[0], ts[1]);
    const a = angle(ts[0], ts[1]);
    const mid = midpoint(ts[0], ts[1]);

    state.transform.scale    = gestureStart.scale * (d / gestureStart.dist);
    state.transform.rotation = gestureStart.rotation + (a - gestureStart.angle);

    // translate with midpoint drag
    state.transform.x = gestureStart.tx + (mid.x - gestureStart.mid.x);
    state.transform.y = gestureStart.ty + (mid.y - gestureStart.mid.y);

    render();
  }
}, { passive: false });

gestureLayer.addEventListener('touchend', e => {
  e.preventDefault();
  const ts = getTouches(e);
  if (ts.length < 2) {
    touch1 = null;
    gestureStart = null;
  }
}, { passive: false });

// ── controls ───────────────────────────────────────────────────────────────
opacitySlider.addEventListener('input', () => {
  state.opacity = opacitySlider.value / 100;
  render();
});

threshSlider.addEventListener('input', () => {
  state.threshold = parseInt(threshSlider.value);
  if (state.edgeData) {
    // re-run edge detection; need original image
    // store original image ref
    if (state.originalImage) {
      loading.classList.add('show');
      setTimeout(() => {
        state.edgeData = detectEdges(state.originalImage, state.threshold);
        render();
        loading.classList.remove('show');
      }, 50);
    }
  }
});

// keep original image for re-processing
const _origLoad = loadImage;
function loadImage(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  loading.classList.add('show');
  img.onload = () => {
    state.originalImage = img;
    setTimeout(() => {
      state.edgeData = detectEdges(img, state.threshold);
      const scaleX = state.canvasW / state.edgeData.w;
      const scaleY = state.canvasH / state.edgeData.h;
      state.transform = { x: 0, y: 0, scale: Math.min(scaleX, scaleY) * 0.9, rotation: 0 };
      render();
      URL.revokeObjectURL(url);
      loading.classList.remove('show');
    }, 50);
  };
  img.src = url;
}

swatches.forEach(s => {
  s.addEventListener('click', () => {
    swatches.forEach(x => x.classList.remove('active'));
    s.classList.add('active');
    state.lineColor = s.dataset.color.split(',').map(Number);
    render();
  });
});

resetBtn.addEventListener('click', () => {
  if (!state.edgeData) return;
  const scaleX = state.canvasW / state.edgeData.w;
  const scaleY = state.canvasH / state.edgeData.h;
  state.transform = { x: 0, y: 0, scale: Math.min(scaleX, scaleY) * 0.9, rotation: 0 };
  render();
});

startBtn.addEventListener('click', async () => {
  welcome.style.display = 'none';
  await startCamera();
});
</script>
</body>
</html>
