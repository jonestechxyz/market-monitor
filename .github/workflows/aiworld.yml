name: AIWorld Daily — Marvel & Panic

on:
  # Started by the Mac mini's clock (~/bin/daily-pages.sh); GitHub's own timer ran late
  # and made pages twice. Watchdog is the backup if the mini is off.
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install openai requests

      - name: Build and upload AIWorld gallery
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FTP_HOST:     ${{ secrets.FTP_HOST }}
          FTP_USER:     ${{ secrets.FTP_USER }}
          FTP_PASS:     ${{ secrets.FTP_PASS }}
          FTP_PATH:     ${{ secrets.FTP_PATH }}
          OUTPUT_PATH:  /tmp/AIWorld.html
        run: |
          cd market_monitor
          python3 aiworld.py
