name: AIWorld Daily — Marvel & Panic

on:
  schedule:
    # 02:07 UTC daily — live before 6am Denmark time year-round.
    # DK is UTC+1 (winter) / UTC+2 (summer), so 6am DK = 04:00–05:00 UTC;
    # 02:07 leaves a buffer for GitHub Actions' scheduling lag. Off-the-hour
    # minute (:07) tends to start more promptly than :00.
    - cron: "7 2 * * *"
  workflow_dispatch:  # allow manual runs from the Actions tab

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install openai requests

      - name: Build and upload AIWorld gallery
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FTP_HOST:     ${{ secrets.FTP_HOST }}
          FTP_USER:     ${{ secrets.FTP_USER }}
          FTP_PASS:     ${{ secrets.FTP_PASS }}
          FTP_PATH:     ${{ secrets.FTP_PATH }}
          OUTPUT_PATH:  /tmp/AIWorld.html
        run: |
          cd market_monitor
          python3 aiworld.py
