name: MAD World Daily Satire

on:
  # Started by the Mac mini's clock (~/bin/daily-pages.sh); GitHub's own timer ran late
  # and made pages twice. Watchdog is the backup if the mini is off.
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install openai requests

      - name: Build and upload MadWorld
        env:
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:   ${{ secrets.CF_API_TOKEN }}
          FTP_HOST:       ${{ secrets.FTP_HOST }}
          FTP_USER:       ${{ secrets.FTP_USER }}
          FTP_PASS:       ${{ secrets.FTP_PASS }}
          FTP_PATH:       ${{ secrets.FTP_PATH }}
          OUTPUT_PATH:    /tmp/MadWorld.html
        run: |
          cd market_monitor
          python3 madworld.py
