name: Asia-EU Market Monitor

on:
  # Started by the Mac mini's clock (~/bin/daily-pages.sh); GitHub's own timer ran late
  # and made pages twice. Watchdog is the backup if the mini is off.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r market_monitor/requirements.txt

      - name: Run daily brief
        env:
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FTP_HOST:            ${{ secrets.FTP_HOST }}
          FTP_USER:            ${{ secrets.FTP_USER }}
          FTP_PASS:            ${{ secrets.FTP_PASS }}
          FTP_PATH:            ${{ secrets.FTP_PATH }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:      ${{ secrets.GMAIL_APP_PASS }}
          BRIEFING_TO:         ${{ secrets.BRIEFING_TO }}
          OUTPUT_PATH:         /tmp/daily.html
        run: |
          cd market_monitor
          python3 daily_brief.py

      - name: Commit updated briefings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_monitor/briefings/
          # Only commit if there are staged changes
          git diff --cached --quiet || git commit -m "chore: add briefing $(date -u +%Y-%m-%d)"
          git push
