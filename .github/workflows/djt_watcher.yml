name: DJT Truth Social Watcher

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r market_monitor/requirements.txt

      - name: Run DJT watcher
        env:
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          BRIEFING_TO:    ${{ secrets.BRIEFING_TO }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd market_monitor
          python djt_watcher.py

      - name: Save state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_monitor/.djt_seen_id
          git diff --cached --quiet || git commit -m "chore: update DJT watcher state"
          git push
