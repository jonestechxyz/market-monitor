name: Watchdog — Catch Missed Scheduled Runs

on:
  schedule:
    # Backup only: the Mac mini starts the dailies from 05:00 Copenhagen time.
    # If the mini was off, this starts whatever hasn't succeeded by 10:30 UTC.
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check and re-trigger missed daily workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Watchdog check for $TODAY"
          WORKFLOWS="aiworld.yml use.yml signal.yml nabokov.yml aiart.yml fork.yml madworld.yml"
          # The market monitor only runs on weekdays.
          [ "$(date -u +%u)" -le 5 ] && WORKFLOWS="market_monitor.yml $WORKFLOWS"
          TRIGGERED=0

          for workflow in $WORKFLOWS; do
            # Done = a successful run today, or one still running.
            OK=$(gh run list --workflow=$workflow --limit=5 -R "$REPO" \
              --json createdAt,status,conclusion \
              --jq "[.[] | select(.createdAt|startswith(\"$TODAY\")) | select(.conclusion==\"success\" or .status!=\"completed\")] | length")
            if [ "$OK" != "0" ]; then
              echo "OK   $workflow already done today"
            else
              # Space the starts out so they don't all hit Groq's per-minute limit together.
              [ "$TRIGGERED" -gt 0 ] && sleep 240
              echo "MISS $workflow - starting it now"
              gh workflow run "$workflow" -R "$REPO"
              TRIGGERED=$((TRIGGERED + 1))
            fi
          done

          echo "Started $TRIGGERED missed workflow(s)."
